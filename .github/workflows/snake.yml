name: 🐍 Cyber Neon Contribution Snake

on:
schedule:
- cron: "0 0 * * *"

workflow_dispatch:

push:
branches:
- main

jobs:
generate:
permissions:
contents: write

```
runs-on: ubuntu-latest

steps:
  - name: 🐍 Generate Cyber Neon Snake
    uses: Platane/snk@v3
    with:
      github_user_name: ${{ github.repository_owner }}

      outputs: |
        dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=%2338BDF8&color_dots=%230B1220%2C%230E7490%2C%230285C7%2C%2338BDF8%2C%237DD3FC
        dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2338BDF8&color_dots=%230B1220%2C%230E7490%2C%230285C7%2C%2338BDF8%2C%237DD3FC

  - name: 🚀 Deploy Snake to Output Branch
    uses: crazy-max/ghaction-github-pages@v4
    with:
      build_dir: dist

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_DIR: dist
```
